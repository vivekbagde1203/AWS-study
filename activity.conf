vi /etc/nginx/conf.d/activity.conf

log_format activity_json escape=json
  '{"time":"$time_iso8601",'
  '"instance_id":"$hostname",'
  '"client_ip":"$remote_addr",'
  '"method":"$request_method",'
  '"path":"$uri",'
  '"query":"$args",'
  '"status":$status,'
  '"bytes_sent":$body_bytes_sent}';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/activity.log activity_json;

    location = /action {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"message":"Activity recorded","event":"$arg_event","instance_id":"$hostname"}';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
